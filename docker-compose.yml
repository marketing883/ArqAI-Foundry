# ArqAI Foundry - Docker Compose Configuration
# Development and production deployment

version: "3.9"

services:
  # ===========================================================================
  # ArqAI Foundry API
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arqai-foundry-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://arqai:arqai_secret@postgres:5432/arqai_foundry
      - REDIS_URL=redis://redis:6379/0
      - VAULT_ADDR=http://vault:8200
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    volumes:
      - ./arqai_foundry:/app/arqai_foundry:ro
      - ./services:/app/services:ro
      - ./api:/app/api:ro
    networks:
      - arqai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: arqai-postgres
    environment:
      POSTGRES_USER: arqai
      POSTGRES_PASSWORD: arqai_secret
      POSTGRES_DB: arqai_foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arqai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqai -d arqai_foundry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: arqai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - arqai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # HashiCorp Vault (Secrets Management)
  # ===========================================================================
  vault:
    image: hashicorp/vault:1.15
    container_name: arqai-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    networks:
      - arqai-network
    restart: unless-stopped

  # ===========================================================================
  # Nginx Reverse Proxy (Production)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: arqai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - arqai-network
    restart: unless-stopped
    profiles:
      - production

# ===========================================================================
# Networks
# ===========================================================================
networks:
  arqai-network:
    driver: bridge

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
  redis_data:
  vault_data:
