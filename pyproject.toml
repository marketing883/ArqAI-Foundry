[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arqai-foundry"
version = "0.1.0"
description = "Enterprise AI Agent Foundry - Build trusted AI agent workforces with governance embedded by design"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "ArqAI", email = "engineering@arqai.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",

    # Security & Cryptography
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "hvac>=2.1.0",  # HashiCorp Vault client
    "bcrypt>=4.1.0",

    # LLM Providers
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "cohere>=4.45.0",
    "mistralai>=0.1.0",
    "boto3>=1.34.0",  # AWS Bedrock

    # Integrations
    "aioboto3>=12.0.0",  # Async AWS
    "jira>=3.6.0",
    "slack-sdk>=3.26.0",
    "msal>=1.26.0",  # MS Teams auth
    "aiohttp>=3.9.0",

    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",

    # Utilities
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.6",
    "celery>=5.3.0",
    "tiktoken>=0.5.0",  # Token counting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
]

[project.scripts]
arqai = "arqai_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arqai_foundry*", "services*", "templates*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=arqai_foundry --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
